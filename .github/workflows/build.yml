name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project VirtualLocation.xcodeproj \
            -target VirtualLocation \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualLocation-simulator
          path: build/Debug-iphonesimulator/*.app
          if-no-files-found: warn
