name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -1)
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la VirtualLocation.xcodeproj

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          if xcodebuild \
            -project VirtualLocation.xcodeproj \
            -target VirtualLocation \
            -configuration Debug \
            -sdk iphonesimulator \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1; then
            echo "::notice::BUILD OK"
          else
            echo "::error::BUILD FAILED, pushing build.log to ci-log branch..."
            git config user.name "CI"
            git config user.email "ci@example.com"
            git fetch origin ci-log 2>/dev/null || true
            git checkout -B ci-log 2>/dev/null || true
            cp build.log ci-build.log
            git add -f ci-build.log
            git commit --allow-empty -m "ci: capture build log $(date +%s)" || true
            git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/leiting2327/VirtualLocation.git" ci-log 2>&1 || echo "PUSH_FAILED"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualLocation-simulator
          path: build/Debug-iphonesimulator/*.app
          if-no-files-found: warn
